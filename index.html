<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vikram Parmar — Data Engineer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

<style>
  :root {
    --cream: #E1E0CC;
    --cream-soft: rgba(225, 224, 204, 0.7);
    --cream-mute: rgba(225, 224, 204, 0.4);
    --bg: #000000;
    --bg-card: #101010;
    --bg-card-2: #1a1a1a;
    --bg-card-3: #212121;
  }

  html { scroll-behavior: smooth; }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Almarai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection { background: var(--cream); color: var(--bg); }

  .serif {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
  }

  /* Noise overlay — fractal noise as SVG data URI */
  .noise-overlay {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    background-size: 200px;
  }
  .bg-noise {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
    background-size: 200px;
  }

  /* ── HERO ────────────────────────────────────────────────────────── */
  .hero {
    height: 100vh;
    padding: 16px;
  }
  @media (min-width: 768px) { .hero { padding: 24px; } }

  .hero-frame {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    overflow: hidden;
    background: #050505;
  }
  @media (min-width: 768px) { .hero-frame { border-radius: 32px; } }

  .hero-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero-noise {
    position: absolute;
    inset: 0;
    opacity: 0.7;
    mix-blend-mode: overlay;
    pointer-events: none;
  }
  .hero-gradient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.45) 0%,
      transparent 30%,
      transparent 45%,
      rgba(0,0,0,0.55) 75%,
      rgba(0,0,0,0.85) 100%);
  }

  /* Navbar — black pill, fixed to top so it persists on scroll */
  .navbar {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-radius: 0 0 16px 16px;
    border: 1px solid rgba(225, 224, 204, 0.08);
    border-top: none;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  @media (min-width: 640px) { .navbar { gap: 24px; padding: 12px 28px; border-radius: 0 0 22px 22px; } }
  @media (min-width: 768px) { .navbar { gap: 48px; padding: 14px 36px; } }
  @media (min-width: 1024px) { .navbar { gap: 56px; } }

  .navbar a {
    font-size: 10px;
    font-weight: 400;
    color: rgba(225, 224, 204, 0.7);
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: color 0.25s ease;
    white-space: nowrap;
  }
  @media (min-width: 640px) { .navbar a { font-size: 12px; } }
  @media (min-width: 768px) { .navbar a { font-size: 13px; } }
  .navbar a:hover { color: var(--cream); }

  /* Navbar inline icon links (LinkedIn/GitHub on the right side of the notch) */
  .navbar .nav-sep {
    width: 1px;
    height: 14px;
    background: rgba(225, 224, 204, 0.15);
    margin: 0 4px;
  }
  .navbar a.nav-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    color: rgba(225, 224, 204, 0.65);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .navbar a.nav-icon:hover {
    color: var(--cream);
    background: rgba(225, 224, 204, 0.08);
  }
  .navbar a.nav-icon::after { display: none !important; }
  .navbar a.active {
    color: var(--cream);
    position: relative;
  }
  .navbar a.active::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -6px;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--cream);
  }

  /* Loading bar — top edge, fills with scroll progress */
  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0;
    background: var(--cream);
    z-index: 200;
    transition: width 0.1s linear;
    box-shadow: 0 0 12px rgba(225, 224, 204, 0.4);
  }

  /* ── TERMINAL ELEMENT ────────────────────────────────────────────── */
  .terminal {
    max-width: 720px;
    margin: 48px auto 0;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(225, 224, 204, 0.14);
    border-radius: 14px;
    padding: 18px 22px 22px;
    font-family: 'JetBrains Mono', monospace;
    text-align: left;
    box-shadow: inset 0 1px 0 rgba(225, 224, 204, 0.04),
                0 30px 60px -30px rgba(0, 0, 0, 0.6);
  }
  .terminal-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(225, 224, 204, 0.08);
  }
  .terminal-head .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(225, 224, 204, 0.18);
  }
  .terminal-head .title {
    margin-left: 12px;
    color: rgba(225, 224, 204, 0.45);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .terminal-body {
    font-size: 13px;
    line-height: 1.65;
    color: rgba(225, 224, 204, 0.7);
  }
  .terminal-body .prompt { color: var(--cream); margin-right: 8px; }
  .terminal-body .cmd { color: var(--cream); }
  .terminal-body .out { color: rgba(225, 224, 204, 0.55); }
  .terminal-body .cursor {
    display: inline-block;
    width: 8px; height: 1em;
    background: var(--cream);
    vertical-align: text-bottom;
    margin-left: 4px;
    animation: blink 1.1s steps(2) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ── DEEP DIVES ─────────────────────────────────────────────────── */
  .deep {
    background: var(--bg);
    padding: 100px 16px 80px;
  }
  @media (min-width: 768px) { .deep { padding: 140px 24px 100px; } }
  .deep-inner { max-width: 1280px; margin: 0 auto; }
  .deep-eyebrow {
    color: var(--cream);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .deep-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(225, 224, 204, 0.08);
  }
  .deep-h {
    color: var(--cream);
    font-size: 32px;
    letter-spacing: -0.025em;
    line-height: 1.05;
    font-weight: 500;
    max-width: 720px;
    margin-bottom: 56px;
  }
  @media (min-width: 768px) { .deep-h { font-size: 44px; } }
  @media (min-width: 1024px) { .deep-h { font-size: 52px; } }
  .deep-h em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: rgba(225, 224, 204, 0.55);
  }
  .deep-list {
    display: flex;
    flex-direction: column;
  }
  .deep-item {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    padding: 28px 0;
    border-top: 1px solid rgba(225, 224, 204, 0.1);
    text-decoration: none;
    color: inherit;
    transition: padding-left 0.35s ease;
  }
  @media (min-width: 768px) {
    .deep-item {
      grid-template-columns: 100px 1fr auto;
      gap: 32px;
      padding: 36px 0;
      align-items: baseline;
    }
  }
  .deep-list .deep-item:last-child { border-bottom: 1px solid rgba(225, 224, 204, 0.1); }
  .deep-item:hover { padding-left: 8px; }
  .deep-num {
    color: rgba(225, 224, 204, 0.4);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
  }
  .deep-title {
    color: var(--cream);
    font-size: 20px;
    letter-spacing: -0.015em;
    line-height: 1.25;
    font-weight: 500;
  }
  @media (min-width: 768px) { .deep-title { font-size: 24px; } }
  .deep-meta {
    color: rgba(225, 224, 204, 0.4);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-top: 6px;
  }
  @media (min-width: 768px) { .deep-meta { margin-top: 0; justify-content: flex-end; } }
  .deep-meta .pip {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(225, 224, 204, 0.35);
  }
  .deep-meta .pip.live { background: var(--cream); animation: breathe 2.2s ease-in-out infinite; }

  /* Scroll fade-up (modest, used on most major blocks) */
  .fade-up {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .fade-up.in { opacity: 1; transform: translateY(0); }

  /* Top-right available indicator */
  .top-right {
    position: absolute;
    top: 32px;
    right: 32px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(225, 224, 204, 0.7);
    font-size: 12px;
    letter-spacing: 0.02em;
  }
  .top-right .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cream);
    animation: breathe 2.2s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* Top-left brand */
  .brand {
    position: absolute;
    top: 32px;
    left: 32px;
    z-index: 20;
    color: var(--cream);
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* "I am" tiny prefix above the wordmark */
  .hero-prefix {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: rgba(225, 224, 204, 0.65);
    font-size: 20px;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
    line-height: 1;
  }
  @media (min-width: 640px) { .hero-prefix { font-size: 24px; } }
  @media (min-width: 768px) { .hero-prefix { font-size: 28px; margin-bottom: 6px; } }
  @media (min-width: 1024px) { .hero-prefix { font-size: 32px; margin-bottom: 8px; } }

  /* Hero content (bottom) */
  .hero-content {
    position: absolute;
    left: 0; right: 0;
    bottom: 56px;
    z-index: 10;
    padding: 0 24px 8px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
    align-items: end;
  }
  @media (min-width: 768px) { .hero-content { padding: 0 36px 8px; bottom: 60px; } }
  @media (min-width: 1024px) {
    .hero-content {
      grid-template-columns: 8fr 4fr;
      gap: 48px;
      padding: 0 48px 8px;
      bottom: 64px;
    }
  }

  .hero-title {
    color: var(--cream);
    font-weight: 500;
    font-size: 26vw;
    line-height: 0.85;
    letter-spacing: -0.07em;
    position: relative;
    margin: 0;
  }
  @media (min-width: 640px) { .hero-title { font-size: 24vw; } }
  @media (min-width: 768px) { .hero-title { font-size: 22vw; } }
  @media (min-width: 1024px) { .hero-title { font-size: 20vw; } }
  @media (min-width: 1280px) { .hero-title { font-size: 19vw; } }
  .hero-title .asterisk {
    position: relative;
    font-size: 0.31em;
    top: -1.5em;
    left: -0.1em;
    font-weight: 400;
  }

  .hero-title .word {
    display: inline-block;
    vertical-align: top;
    white-space: nowrap;
  }
  .hero-title .word > span {
    display: inline-block;
  }

  .hero-text-col {
    color: var(--cream-soft);
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 380px;
  }
  @media (min-width: 1024px) { .hero-text-col { justify-self: end; } }

  .hero-text-col p {
    font-size: 15px;
    line-height: 1.55;
    color: rgba(225, 224, 204, 0.95);
    text-shadow: 0 1px 16px rgba(0,0,0,0.6);
  }
  @media (min-width: 640px) { .hero-text-col p { font-size: 16px; } }
  @media (min-width: 768px) { .hero-text-col p { font-size: 17px; } }
  @media (min-width: 1024px) { .hero-text-col p { font-size: 18px; line-height: 1.5; } }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--cream);
    color: #000;
    text-decoration: none;
    border-radius: 999px;
    padding: 4px 4px 4px 22px;
    font-size: 14px;
    font-weight: 500;
    align-self: flex-start;
    transition: gap 0.35s ease;
  }
  .cta:hover { gap: 14px; }
  .cta-circle {
    width: 36px; height: 36px;
    background: #000;
    color: var(--cream);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.35s ease;
  }
  .cta:hover .cta-circle { transform: scale(1.08); }
  @media (min-width: 640px) {
    .cta { font-size: 15px; padding: 5px 5px 5px 24px; }
    .cta-circle { width: 40px; height: 40px; }
  }

  /* ── ABOUT ───────────────────────────────────────────────────────── */
  .about {
    background: var(--bg);
    padding: 96px 16px;
  }
  @media (min-width: 768px) { .about { padding: 140px 24px; } }

  .about-card {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 64px 32px;
    max-width: 1280px;
    margin: 0 auto;
    text-align: center;
  }
  @media (min-width: 768px) { .about-card { padding: 96px 56px; border-radius: 32px; } }
  @media (min-width: 1024px) { .about-card { padding: 120px 80px; } }

  .about-eyebrow {
    color: var(--cream);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 36px;
    font-weight: 400;
  }
  @media (min-width: 768px) { .about-eyebrow { font-size: 12px; margin-bottom: 48px; } }

  .about-h {
    color: var(--cream);
    font-size: 30px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    font-weight: 500;
    max-width: 980px;
    margin: 0 auto 56px;
  }
  @media (min-width: 640px) { .about-h { font-size: 40px; } }
  @media (min-width: 768px) { .about-h { font-size: 52px; } }
  @media (min-width: 1024px) { .about-h { font-size: 60px; line-height: 1.05; } }
  @media (min-width: 1280px) { .about-h { font-size: 68px; } }

  .about-h .seg {
    display: inline;
  }
  .about-h .seg .word {
    display: inline-block;
    white-space: nowrap;
  }
  .about-h .seg .word > span {
    display: inline-block;
  }

  .about-body {
    color: var(--cream-soft);
    font-size: 14px;
    line-height: 1.55;
    max-width: 720px;
    margin: 0 auto;
  }
  @media (min-width: 768px) { .about-body { font-size: 16px; } }
  @media (min-width: 1024px) { .about-body { font-size: 17px; } }
  .about-body .char {
    color: rgba(225, 224, 204, 0.2);
    transition: color 0.25s ease;
  }
  .about-body .char.lit {
    color: rgba(225, 224, 204, 0.95);
  }

  /* ── WORK CARDS ──────────────────────────────────────────────────── */
  .work {
    position: relative;
    background: var(--bg);
    min-height: 100vh;
    padding: 80px 16px 100px;
    overflow: hidden;
  }
  @media (min-width: 768px) { .work { padding: 120px 24px 140px; } }
  .work-noise {
    position: absolute;
    inset: 0;
    opacity: 0.12;
    pointer-events: none;
  }

  .work-header {
    max-width: 1280px;
    margin: 0 auto 56px;
    text-align: left;
  }
  @media (min-width: 1024px) { .work-header { margin-bottom: 72px; } }
  .work-header h2 {
    color: var(--cream);
    font-size: 22px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 400;
  }
  @media (min-width: 640px) { .work-header h2 { font-size: 28px; } }
  @media (min-width: 768px) { .work-header h2 { font-size: 32px; } }
  @media (min-width: 1024px) { .work-header h2 { font-size: 40px; } }
  .work-header h2 .quiet { color: #6B6A5C; display: block; }

  .work-grid {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 768px) { .work-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
  @media (min-width: 1024px) {
    .work-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      height: 480px;
    }
  }

  .card {
    background: var(--bg-card-3);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    min-height: 380px;
    border: 1px solid transparent;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.3s ease,
                box-shadow 0.3s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(225, 224, 204, 0.16);
    box-shadow: 0 30px 60px -30px rgba(225, 224, 204, 0.08);
  }
  @media (min-width: 1024px) { .card { min-height: 100%; padding: 32px 28px; } }

  /* Impact metric badge — bold pill at top of each work card */
  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 6px 12px 6px 10px;
    background: rgba(225, 224, 204, 0.06);
    border: 1px solid rgba(225, 224, 204, 0.14);
    border-radius: 999px;
    color: var(--cream);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
    text-transform: uppercase;
    white-space: nowrap;
    max-width: 100%;
  }
  .card-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cream);
    flex-shrink: 0;
  }
  .card-badge b { font-weight: 500; letter-spacing: 0.02em; }

  .card-hero {
    background: var(--bg-card-2);
    padding: 0;
    overflow: hidden;
    position: relative;
  }
  .card-hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card-hero .cap {
    position: absolute;
    bottom: 24px;
    left: 24px;
    right: 24px;
    color: var(--cream);
    font-size: 18px;
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -0.01em;
    z-index: 2;
  }
  @media (min-width: 1024px) { .card-hero .cap { font-size: 22px; } }
  .card-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.65), transparent 55%);
    pointer-events: none;
    z-index: 1;
  }

  .card-num {
    color: var(--cream-mute);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .card h3 {
    color: var(--cream);
    font-size: 22px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    font-weight: 500;
    margin-bottom: 18px;
  }
  .card ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: auto;
    padding-bottom: 24px;
  }
  .card ul li {
    display: flex;
    gap: 10px;
    color: rgba(225,224,204,0.6);
    font-size: 13px;
    line-height: 1.4;
  }
  .card ul li svg {
    flex-shrink: 0;
    margin-top: 2px;
  }
  .card ul li b {
    color: var(--cream);
    font-weight: 400;
  }

  .card-foot {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--cream);
    font-size: 13px;
    text-decoration: none;
    align-self: flex-start;
    transition: gap 0.25s ease;
  }
  .card-foot:hover { gap: 12px; }
  .card-foot .arrow {
    display: inline-flex;
    width: 18px; height: 18px;
    transform: rotate(-45deg);
    transition: transform 0.25s ease;
  }
  .card-foot:hover .arrow { transform: rotate(0deg); }

  /* ── ABOUT2 / META (skills + contact) ─────────────────────────────── */
  .meta {
    background: var(--bg);
    padding: 80px 16px 56px;
  }
  @media (min-width: 768px) { .meta { padding: 100px 24px 80px; } }
  .meta-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 56px;
  }
  @media (min-width: 1024px) {
    .meta-inner { grid-template-columns: 1fr 1.4fr; gap: 96px; }
  }
  .meta-eyebrow {
    color: var(--cream);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .meta-block h3 {
    color: var(--cream);
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 12px;
    letter-spacing: 0.01em;
  }
  .meta-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .meta-stack:hover .meta-stack-row { color: rgba(225, 224, 204, 0.35); }
  .meta-stack:hover .meta-stack-row:hover { color: var(--cream); }
  .meta-stack:hover .meta-stack-row:hover .label { color: var(--cream-soft); }
  .meta-stack-row {
    color: var(--cream-soft);
    font-size: 14px;
    line-height: 1.55;
    transition: color 0.25s ease;
  }
  @media (min-width: 768px) { .meta-stack-row { font-size: 15px; } }
  .meta-stack-row .label {
    color: var(--cream-mute);
    margin-right: 12px;
    display: inline-block;
    min-width: 90px;
  }

  /* Contact links list */
  .links {
    display: flex;
    flex-direction: column;
  }
  .links a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--cream);
    text-decoration: none;
    padding: 18px 0;
    border-bottom: 1px solid rgba(225,224,204,0.1);
    font-size: 16px;
    transition: padding 0.3s ease;
  }
  @media (min-width: 768px) { .links a { font-size: 20px; padding: 22px 0; } }
  .links a:first-child { border-top: 1px solid rgba(225,224,204,0.1); }
  .links a:hover { padding-left: 12px; }
  .link-l {
    display: inline-flex;
    align-items: center;
    gap: 14px;
  }
  .link-ic {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    color: rgba(225, 224, 204, 0.6);
    background: rgba(225, 224, 204, 0.05);
    border: 1px solid rgba(225, 224, 204, 0.1);
    transition: color 0.25s ease, background 0.25s ease, border-color 0.25s ease;
    flex-shrink: 0;
  }
  .links a:hover .link-ic {
    color: var(--cream);
    background: rgba(225, 224, 204, 0.1);
    border-color: rgba(225, 224, 204, 0.25);
  }
  .links a .arrow {
    color: var(--cream-mute);
    transition: transform 0.3s ease, color 0.3s ease;
  }
  .links a:hover .arrow {
    color: var(--cream);
    transform: translateX(4px);
  }

  /* ── FOOTER ──────────────────────────────────────────────────────── */
  footer {
    border-top: 1px solid rgba(225,224,204,0.08);
    padding: 32px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    color: var(--cream-mute);
    font-size: 12px;
    letter-spacing: 0.02em;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* Scroll fade-in helper */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* ── ARCHITECTURE FLOW (calm static SVG row) ─────────────────────── */
  .arch {
    max-width: 1280px;
    margin: 0 auto 48px;
    padding: 28px 24px;
    border: 1px solid rgba(225, 224, 204, 0.1);
    border-radius: 18px;
    background: rgba(225, 224, 204, 0.02);
  }
  @media (min-width: 768px) { .arch { padding: 32px; margin-bottom: 64px; } }
  .arch-caption {
    color: rgba(225, 224, 204, 0.45);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .arch-caption::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(225, 224, 204, 0.08);
  }
  .arch-flow {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(225, 224, 204, 0.7);
  }
  @media (max-width: 768px) {
    .arch-flow { grid-template-columns: 1fr; gap: 14px; }
    .arch-flow .arr { display: none; }
  }
  .arch-node {
    border: 1px solid rgba(225, 224, 204, 0.12);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .arch-node:hover {
    border-color: rgba(225, 224, 204, 0.32);
    background: rgba(225, 224, 204, 0.04);
  }
  .arch-node .role {
    color: rgba(225, 224, 204, 0.4);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .arch-node .name {
    color: var(--cream);
    font-size: 13px;
    letter-spacing: 0.01em;
  }
  .arch-flow .arr {
    text-align: center;
    color: rgba(225, 224, 204, 0.25);
    font-size: 14px;
  }

  /* ── STAT ROW (animated counters) ─────────────────────────────────── */
  .stat-row {
    max-width: 1280px;
    margin: 0 auto 64px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0;
    border-top: 1px solid rgba(225, 224, 204, 0.08);
    border-bottom: 1px solid rgba(225, 224, 204, 0.08);
  }
  @media (min-width: 768px) {
    .stat-row { grid-template-columns: repeat(4, 1fr); }
  }
  .stat {
    padding: 32px 24px;
    border-right: 1px solid rgba(225, 224, 204, 0.08);
  }
  .stat:nth-child(2n) { border-right: none; }
  @media (min-width: 768px) {
    .stat:nth-child(2n) { border-right: 1px solid rgba(225, 224, 204, 0.08); }
    .stat:last-child { border-right: none; }
  }
  .stat-num {
    color: var(--cream);
    font-size: 40px;
    line-height: 1;
    letter-spacing: -0.03em;
    font-weight: 500;
    margin-bottom: 12px;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 2px;
  }
  @media (min-width: 768px) { .stat-num { font-size: 52px; } }
  @media (min-width: 1024px) { .stat-num { font-size: 60px; } }
  .stat-num .unit {
    font-size: 0.45em;
    color: rgba(225, 224, 204, 0.6);
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-left: 2px;
  }
  .stat-num .sep {
    font-size: 0.7em;
    color: rgba(225, 224, 204, 0.4);
    font-weight: 400;
    margin: 0 4px;
  }
  .stat-label {
    color: rgba(225, 224, 204, 0.5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1.4;
  }

  /* ── STORY CARD ROWS (Problem / Scale / Stack / Impact) ──────────── */
  .card-story {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: auto;
    padding-bottom: 24px;
  }
  .card-row {
    display: grid;
    grid-template-columns: 78px 1fr;
    gap: 14px;
    align-items: baseline;
  }
  .card-row .l {
    color: rgba(225, 224, 204, 0.4);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    line-height: 1.55;
  }
  .card-row .v {
    color: rgba(225, 224, 204, 0.78);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .card-row .v b {
    color: var(--cream);
    font-weight: 400;
  }
  .card-row .v em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--cream);
    font-size: 1.04em;
    letter-spacing: -0.005em;
  }
  .card-row.stack .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: rgba(225, 224, 204, 0.6);
    letter-spacing: 0.01em;
  }

  /* ── PHILOSOPHY ──────────────────────────────────────────────────── */
  .philosophy {
    max-width: 880px;
    margin: 96px auto 0;
    padding-top: 56px;
    border-top: 1px solid rgba(225, 224, 204, 0.1);
    text-align: left;
  }
  .philosophy-eyebrow {
    color: rgba(225, 224, 204, 0.5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .philosophy ol {
    list-style: none;
    counter-reset: ph;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .philosophy li {
    counter-increment: ph;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 18px;
    align-items: baseline;
    color: var(--cream-soft);
    font-size: 15px;
    line-height: 1.6;
  }
  .philosophy li > p { margin: 0; }
  @media (min-width: 768px) {
    .philosophy li { font-size: 17px; grid-template-columns: 56px 1fr; gap: 24px; }
  }
  .philosophy li::before {
    content: counter(ph, decimal-leading-zero);
    color: rgba(225, 224, 204, 0.4);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding-top: 4px;
  }
  .philosophy li em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    color: var(--cream);
    font-size: 1.06em;
  }

  @media (max-width: 640px) {
    .top-right, .brand { display: none; }
  }

  /* ── PREVIOUSLY — career timeline strip ──────────────────────────── */
  .prev {
    max-width: 1280px;
    margin: 80px auto 0;
    padding-top: 40px;
    border-top: 1px solid rgba(225, 224, 204, 0.1);
  }
  @media (min-width: 1024px) { .prev { margin-top: 96px; padding-top: 48px; } }
  .prev-eyebrow {
    color: rgba(225, 224, 204, 0.5);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .prev-list {
    display: flex;
    flex-direction: column;
  }
  .prev-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    padding: 18px 0;
    border-bottom: 1px solid rgba(225, 224, 204, 0.08);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  @media (min-width: 768px) {
    .prev-row {
      grid-template-columns: 130px 1.4fr 1fr;
      gap: 24px;
      padding: 22px 0;
      align-items: baseline;
    }
  }
  .prev-row:last-child { border-bottom: none; }
  .prev-yr { color: rgba(225, 224, 204, 0.45); }
  .prev-role { color: var(--cream); font-size: 14px; }
  @media (min-width: 768px) { .prev-role { font-size: 15px; } }
  .prev-org { color: rgba(225, 224, 204, 0.55); }
  @media (min-width: 768px) { .prev-org { text-align: right; } }

  /* ── DATA ENGINEER FLAVOR ─────────────────────────────────────────── */
  /* mono accent — sits under the wordmark like a spec sheet */
  .hero-spec {
    color: rgba(225, 224, 204, 0.45);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    line-height: 1.5;
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .hero-spec > span {
    white-space: nowrap;
  }
  .hero-spec .sep {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(225,224,204,0.4);
    flex-shrink: 0;
  }
  .hero-spec b {
    color: var(--cream);
    font-weight: 500;
  }
  @media (min-width: 768px) { .hero-spec { font-size: 12px; } }

  /* System-status badge — extends the top-right Available indicator */
  .top-right .sep {
    color: rgba(225,224,204,0.3);
    margin: 0 2px;
  }
  .top-right .stat {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
    color: rgba(225,224,204,0.85);
  }
  .top-right .stat b {
    color: var(--cream);
    font-weight: 500;
  }
  .top-right .quiet {
    color: rgba(225,224,204,0.35);
  }

  /* Description: italic serif accent inline */
  .hero-text-col p em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--cream);
    font-size: 1.08em;
    letter-spacing: -0.005em;
  }

  /* Event ticker at the bottom of the hero frame */
  .ticker {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    height: 38px;
    z-index: 12;
    overflow: hidden;
    display: flex;
    align-items: center;
    border-top: 1px solid rgba(225, 224, 204, 0.08);
    color: rgba(225, 224, 204, 0.55);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    -webkit-mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
    mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
    pointer-events: none;
  }
  .ticker-track {
    display: flex;
    align-items: center;
    gap: 56px;
    width: max-content;
    height: 100%;
    animation: tickerRoll 90s linear infinite;
    white-space: nowrap;
  }
  @keyframes tickerRoll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  .ticker-track .ev {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    flex: 0 0 auto;
  }
  .ticker-track .ts { color: rgba(225, 224, 204, 0.35); }
  .ticker-track .topic { color: var(--cream); }
  .ticker-track .meta { color: rgba(225, 224, 204, 0.4); }
  .ticker-track .live-pip {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--cream);
    flex-shrink: 0;
  }

  /* Currently / Note — personal aside block in About */
  .currently {
    max-width: 720px;
    margin: 56px auto 0;
    padding-top: 40px;
    border-top: 1px solid rgba(225, 224, 204, 0.1);
    text-align: left;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    color: var(--cream-soft);
    font-size: 14px;
    line-height: 1.55;
  }
  @media (min-width: 768px) {
    .currently {
      grid-template-columns: 140px 1fr;
      gap: 32px;
      align-items: baseline;
      font-size: 15px;
    }
  }
  .currently .label {
    color: rgba(225, 224, 204, 0.45);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .currently .body {
    color: var(--cream-soft);
  }
  .currently em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    color: var(--cream);
    font-size: 1.06em;
    letter-spacing: -0.005em;
  }
  .currently .body + .body { margin-top: -6px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="prisma-app.jsx"></script>
</body>
</html>
