<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vikram Parmar — Data Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">

<style>
  :root {
    --bg: #0E0E0C;
    --bg-elev: #16161300;
    --fg: #F4F1EA;
    --fg-dim: #A29E94;
    --fg-mute: #5E5B53;
    --line: #25241F;
    --line-strong: #34322B;
    --accent: oklch(0.78 0.14 65);
    --accent-soft: oklch(0.78 0.14 65 / 0.12);
    --accent-line: oklch(0.78 0.14 65 / 0.35);
    --radius: 4px;
    --container: 1240px;
  }

  body.light {
    --bg: #F6F3EC;
    --bg-elev: #FFFFFF;
    --fg: #161410;
    --fg-dim: #5A574F;
    --fg-mute: #9B9890;
    --line: #E4DFD3;
    --line-strong: #CFC9BA;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: 'ss01', 'cv11';
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
    transition: background 0.4s ease, color 0.4s ease;
  }

  ::selection { background: var(--accent); color: var(--bg); }

  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'ss02'; }
  .serif { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }

  .container {
    max-width: var(--container);
    margin: 0 auto;
    padding: 0 32px;
  }

  /* Top bar */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    background: color-mix(in oklch, var(--bg) 70%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    max-width: var(--container);
    margin: 0 auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: -0.01em;
  }
  .brand-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }
  .nav {
    display: flex;
    gap: 28px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .nav a {
    color: var(--fg-dim);
    text-decoration: none;
    transition: color 0.2s;
    position: relative;
  }
  .nav a:hover { color: var(--fg); }
  .nav a .idx { color: var(--fg-mute); margin-right: 6px; }

  .nav-cta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .nav-cta:hover { border-color: var(--accent); color: var(--accent); }

  /* HERO */
  .hero {
    padding: 140px 0 80px;
    position: relative;
    overflow: hidden;
  }
  .hero-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 80px;
    align-items: end;
  }
  .hero-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hero-eyebrow::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--accent);
  }
  .hero h1 {
    font-family: 'Inter', sans-serif;
    font-size: clamp(48px, 8vw, 112px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    font-weight: 500;
    margin-bottom: 28px;
  }
  .hero h1 .serif {
    font-size: 0.92em;
    letter-spacing: -0.02em;
    color: var(--fg-dim);
  }
  .hero-lede {
    font-size: clamp(18px, 1.6vw, 22px);
    line-height: 1.45;
    color: var(--fg-dim);
    max-width: 580px;
    margin-bottom: 40px;
  }
  .hero-lede strong {
    color: var(--fg);
    font-weight: 500;
  }
  .hero-meta {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--fg-mute);
  }
  .hero-meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hero-meta-item .dot {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
  }

  /* Live stream panel */
  .stream {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: color-mix(in oklch, var(--bg) 60%, transparent);
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    width: 100%;
  }
  .stream-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--fg-mute);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .stream-head-left { display: flex; align-items: center; gap: 8px; }
  .stream-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
  }
  .stream-status .dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .stream-body {
    padding: 12px 14px;
    height: 280px;
    overflow: hidden;
    position: relative;
    background:
      linear-gradient(to bottom, var(--bg) 0%, transparent 8%, transparent 92%, var(--bg) 100%);
  }
  .stream-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stream-row {
    display: grid;
    grid-template-columns: 64px 60px 1fr auto;
    gap: 12px;
    color: var(--fg-dim);
    font-size: 11px;
    line-height: 1.4;
    animation: streamIn 0.4s ease-out;
  }
  @keyframes streamIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stream-row .ts { color: var(--fg-mute); }
  .stream-row .topic { color: var(--accent); }
  .stream-row .payload { color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stream-row .status { color: var(--fg-mute); }

  /* SECTIONS */
  section { padding: 100px 0; position: relative; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 56px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .section-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .section-title {
    font-size: clamp(28px, 3.4vw, 44px);
    letter-spacing: -0.025em;
    font-weight: 500;
    line-height: 1.05;
  }
  .section-sub {
    margin-left: auto;
    color: var(--fg-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  /* IMPACT METRICS */
  .impact-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  .metric {
    padding: 36px 28px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    position: relative;
    transition: background 0.3s;
  }
  .metric:hover { background: var(--accent-soft); }
  .metric-value {
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1;
    letter-spacing: -0.03em;
    font-weight: 500;
    margin-bottom: 16px;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .metric-value .unit {
    font-size: 0.45em;
    color: var(--fg-dim);
    font-weight: 400;
    letter-spacing: -0.01em;
  }
  .metric-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    line-height: 1.5;
  }

  /* EXPERIENCE */
  .experience-list {
    display: flex;
    flex-direction: column;
  }
  .exp {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 48px;
    padding: 40px 0;
    border-bottom: 1px solid var(--line);
    align-items: start;
  }
  .exp:last-child { border-bottom: none; }
  .exp-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--fg-mute);
    line-height: 1.7;
  }
  .exp-meta .role-status {
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }
  .exp-meta .role-status .dot {
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
  }
  .exp-company {
    font-size: 28px;
    letter-spacing: -0.02em;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .exp-role {
    color: var(--fg-dim);
    font-size: 16px;
    margin-bottom: 24px;
  }
  .exp-bullets {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .exp-bullets li {
    color: var(--fg-dim);
    font-size: 15px;
    line-height: 1.6;
    padding-left: 20px;
    position: relative;
    max-width: 720px;
  }
  .exp-bullets li::before {
    content: '';
    position: absolute;
    left: 0; top: 11px;
    width: 6px; height: 1px;
    background: var(--accent);
  }
  .exp-bullets li b {
    color: var(--fg);
    font-weight: 500;
    background: var(--accent-soft);
    padding: 1px 6px;
    border-radius: 3px;
  }

  /* SKILLS */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }
  .skill-cat {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    transition: border-color 0.3s;
  }
  .skill-cat:hover { border-color: var(--line-strong); }
  .skill-cat-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .skill-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .skill-list span {
    font-size: 14px;
    color: var(--fg-dim);
    transition: color 0.2s;
  }
  .skill-cat:hover .skill-list span { color: var(--fg); }

  /* PROJECT */
  .project {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: center;
    padding: 40px 0;
  }
  .project-info .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
  }
  .project-info h3 {
    font-size: 40px;
    letter-spacing: -0.025em;
    font-weight: 500;
    margin-bottom: 16px;
    line-height: 1.05;
  }
  .project-info p {
    color: var(--fg-dim);
    font-size: 17px;
    line-height: 1.55;
    margin-bottom: 28px;
  }
  .project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 32px;
  }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg-dim);
  }
  .project-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    border-bottom: 1px solid var(--accent-line);
    padding-bottom: 4px;
    transition: gap 0.2s;
  }
  .project-link:hover { gap: 14px; }

  .project-visual {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background:
      repeating-linear-gradient(
        135deg,
        transparent 0,
        transparent 12px,
        color-mix(in oklch, var(--line) 50%, transparent) 12px,
        color-mix(in oklch, var(--line) 50%, transparent) 13px
      );
    position: relative;
  }
  .terminal-head {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .terminal-head .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
  }
  .terminal-head .title {
    margin-left: 10px;
    color: var(--fg-mute);
    font-size: 11px;
  }
  .terminal-body { color: var(--fg-dim); line-height: 1.7; }
  .terminal-body .prompt { color: var(--accent); }
  .terminal-body .comment { color: var(--fg-mute); }
  .terminal-body .ok { color: var(--accent); }

  /* PUBLICATION */
  .pub {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: center;
    transition: border-color 0.3s;
  }
  .pub:hover { border-color: var(--accent); }
  .pub-title {
    font-size: 22px;
    letter-spacing: -0.015em;
    font-weight: 500;
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .pub-meta {
    color: var(--fg-mute);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }
  .pub-doi {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-dim);
    border-left: 1px solid var(--line);
    padding-left: 24px;
  }

  /* CONTACT */
  .contact {
    padding: 140px 0 60px;
    text-align: left;
  }
  .contact-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .contact h2 {
    font-size: clamp(48px, 7vw, 96px);
    letter-spacing: -0.035em;
    font-weight: 500;
    line-height: 1;
    margin-bottom: 40px;
    max-width: 900px;
  }
  .contact h2 .serif {
    color: var(--accent);
  }
  .contact-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    border-top: 1px solid var(--line);
    padding-top: 32px;
  }
  .contact-card {
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .contact-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-mute);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .contact-value {
    font-size: 18px;
    color: var(--fg);
    letter-spacing: -0.01em;
    transition: color 0.2s;
    word-break: break-all;
  }
  .contact-card:hover .contact-value { color: var(--accent); }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 0;
    margin-top: 80px;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--fg-mute);
  }

  /* Background dot grid */
  .dotgrid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, color-mix(in oklch, var(--fg-mute) 30%, transparent) 0.8px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.4;
    mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 0%, transparent 70%);
    z-index: -1;
  }

  /* Floating gradient blobs */
  .blobs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -2;
    overflow: hidden;
    filter: blur(110px);
    opacity: 0.22;
  }
  body.light .blobs { opacity: 0.18; filter: blur(120px); }
  .blob {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: var(--accent);
  }
  .blob.a { top: -180px; left: -120px; animation: drift1 24s ease-in-out infinite; }
  .blob.b { top: 30%; right: -160px; background: color-mix(in oklch, var(--accent) 60%, oklch(0.65 0.18 320)); animation: drift2 32s ease-in-out infinite; }
  .blob.c { bottom: -200px; left: 30%; background: color-mix(in oklch, var(--accent) 50%, oklch(0.65 0.18 200)); animation: drift3 28s ease-in-out infinite; }
  @keyframes drift1 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.15); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-60px, 100px) scale(0.9); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(0,0) scale(1); }
    50% { transform: translate(-100px, -40px) scale(1.1); }
  }

  /* Topology canvas */
  .topology {
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 520px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background:
      radial-gradient(ellipse at 50% 100%, var(--accent-soft) 0%, transparent 60%),
      color-mix(in oklch, var(--bg) 70%, transparent);
    position: relative;
    overflow: hidden;
  }
  .topology canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .topology-head {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fg-mute);
    z-index: 2;
    pointer-events: none;
  }
  .topology-head .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--accent);
  }
  .topology-head .live .dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .topology-foot {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--fg-mute);
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to top, color-mix(in oklch, var(--bg) 90%, transparent), transparent);
  }
  .topology-foot span b {
    color: var(--accent);
    font-weight: 500;
  }

  /* Marquee */
  .marquee {
    overflow: hidden;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 22px 0;
    margin: 40px 0 0;
    -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
  }
  .marquee-track {
    display: flex;
    gap: 64px;
    width: max-content;
    animation: scroll 40s linear infinite;
    font-family: 'Inter', sans-serif;
  }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee-item {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--fg-dim);
    white-space: nowrap;
    transition: color 0.2s;
  }
  .marquee-item:hover { color: var(--fg); }
  .marquee-item .sep {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.6;
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  /* Sparkline */
  .metric-spark {
    margin-top: 18px;
    height: 32px;
    width: 100%;
    display: block;
  }
  .metric-spark path.line {
    fill: none;

    stroke-width: 1.5;

    stroke-linecap: round;
  }
  .metric-spark path.fill {
    fill: var(--accent-soft);
    stroke: none;
  }

  /* Reveal animation */
  .reveal {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
